# Task complexity classification policy.
version: "1.0"

classification:
  # Small, localized change.
  S:
    criteria:
      - small and well-defined implementation scope
      - minor extensions of existing functionality
      - substantial reuse of existing components
      - no significant architecture or data model changes
      - low implementation risk

  # Medium, standalone feature.
  M:
    criteria:
      - substantial new functionality
      - non-trivial business logic changes
      - significant coordination across components
      - moderate implementation risk

  # Large, complex feature.
  L:
    criteria:
      - significant architecture or data model changes
      - complex cross-service interactions
      - high implementation or business risk
      - substantial implementation scope regardless of
        individual component complexity
      - significant infrastructure or testing framework changes
      - extensive coordination across multiple scenarios

  # Task exceeding the acceptable complexity.
  XL:
    criteria:
      - multiple independent large features
      - excessive implementation scope
      - cannot be reliably implemented as a single task
    decomposition_required: true

rules:
  - evaluate scope, complexity, and risk
  - classify by the highest applicable complexity level
  - do not classify solely by the number of changed files
  - avoid overestimating task complexity
  - respect explicit human classification
  - decompose XL tasks into S, M, or L tasks
  - consider the degree of reuse of existing functionality
  - minor backward-compatible API extensions do not
    automatically increase task complexity
  - changes across multiple components alone are not sufficient to classify a task as M
  - evaluate implementation scope independently
    of technical complexity
  - substantial reuse does not reduce complexity when the overall implementation scope remains large
  - consider infrastructure, integration, and testing effort when relevant to the task

