version: "1.0"
project: "JavaSash/wimmly"
title: "Русский интерфейс Telegram-бота"
task_objective: "Показывать пользователям русский интерфейс Wimmly и использовать существующие английские коды категорий при хранении и обработке транзакций."
complexity: "M"
status: "READY"

current_implementation: >-
  Справочник budget уже возвращает английский code и русское description
  для каждой категории. На шаге выбора категории бот использует code и как
  подпись кнопки, и как значение callback. Обработчик сохраняет code
  в черновике или контексте поиска, а budget записывает его в транзакцию.
  Список транзакций выводит код. Подтверждение создания выводит описание
  известной категории, но при отсутствии описания выводит исходный код.
  В BotCommand есть английские описания, в том числе для start и help.

functional_requirements:
  - >-
    Показывать на русском весь текст, который формирует бот для пользователя:
    сообщения, подсказки, ошибки, подписи кнопок и описания публичных команд.
    Это относится и к превью билдера, где кнопки подписаны «ввести дату»,
    «ввести комментарий», «готово».
  - >-
    Показывать существующие русские названия категорий доходов и расходов
    из справочника budget во всех местах, где бот отображает категорию:
    при выборе для создания и поиска, в превью и подтверждении создания,
    в результатах поиска, данных транзакции при удалении и отчётах.
  - >-
    Каждая кнопка выбора категории передаёт соответствующий английский код
    текущего типа транзакции. По этому коду работают сохранение транзакции,
    фильтрация и группировка. Существующие коды в БД сохраняются.
  - >-
    Если исторический код категории не найден в справочнике, показывать
    «Неизвестная категория». Сохранять исходный код и учитывать запись
    в результатах и итогах по прежним правилам.
  - >-
    Сверить справку бота и раздел о кнопках в tg-bot/README.md с поведением
    после локализации. Если описания публичных команд в меню Telegram
    задаются отдельно, локализовать и эти описания.

acceptance_criteria:
  - >-
    При создании расхода кнопка «Еда» передаёт FOOD, а при создании дохода
    кнопка «Зарплата» передаёт SALARY. В превью и подтверждении отображаются
    русские названия, в черновике и сохранённой транзакции используются
    соответствующие английские коды.
  - >-
    Поиск по кнопке «Еда» находит ранее сохранённые записи с кодом FOOD.
    В результатах поиска и при удалении такой транзакции отображается «Еда»
    везде, где показана категория. Отчёты показывают русские названия,
    состав групп и суммы совпадают с результатом до локализации.
  - >-
    Для записи с неизвестным кодом бот показывает «Неизвестная категория»
    в пользовательских представлениях, сохраняет исходный код и продолжает
    отображать транзакцию и рассчитывать итоги.
  - >-
    В публичных сценариях бота сообщения, ошибки, описания команд и кнопки
    на русском. Команды /start, /help и остальные существующие команды
    выполняются по прежним идентификаторам. Текст введённого пользователем
    комментария отображается в исходном виде.

constraints:
  - "Сохранить существующие коды категорий, формат данных БД и контракт API budget. Миграция записей для локализации не требуется."
  - "Язык текста, введённого пользователем, и идентификаторы slash-команд Telegram сохраняются."

assumptions:
  - "Требование относится ко всем публичным сценариям Telegram-бота. Для неизвестного исторического кода используется нейтральная русская подпись."
