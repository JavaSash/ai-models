version: "1.0"
project: "JavaSash/wimmly"
title: "Главное меню Telegram-бота с русскими кнопками"
task_objective: "Пользователь запускает основные действия кнопками и после завершения сценария может сразу выбрать следующее действие."
complexity: "M"
status: "READY"

current_implementation: >-
  TelegramConsumer регистрирует обработчики slash-команд, ReceiverService
  направляет обычный текст и нажатия кнопок в текущий шаг диалога.
  Бот уже использует клавиатуры внутри сценариев. Главное меню отсутствует.
  После создания транзакции CreateTransactionStep показывает подтверждение
  и переходит к BALANCE. Поиск и отчёты показывают результат и завершаются
  без меню. FinalStep очищает временное состояние. Для нового пользователя
  /start ведёт к справке, для существующего запускает баланс.

functional_requirements:
  - >-
    Показывать главное меню русскими кнопками рядом с полем ввода в личном
    чате. Кнопки «Добавить доход», «Добавить расход», «Найти транзакции»,
    «Удалить транзакцию», «Баланс», «Отчёты», «Справка» и «О боте» открывают
    соответствующие существующие сценарии. «Отчёты» открывает подменю
    с кнопками «За сегодня», «За неделю», «За месяц», «За год» и «Назад».
    «Назад» возвращает главное меню.
  - >-
    Показывать меню при /start после существующей регистрации и при /menu.
    После завершения действия показать его штатный результат и автоматически
    вернуть главное меню. По возможности прикреплять клавиатуру к сообщению
    с результатом. После сохранения дохода или расхода пользователь видит
    подтверждение и меню. Баланс открывается по кнопке «Баланс».
  - >-
    На промежуточных шагах показывать нужные кнопки сценария или поле
    для свободного ввода. При исправимой ошибке оставлять пользователя
    на текущем шаге. Обычный текст, совпавший с подписью пункта меню
    во время ввода комментария, обрабатывается как комментарий.
  - >-
    Разрешить /menu во время незавершённого сценария. Команда завершает
    диалог, очищает его временные данные и открывает главное меню.
    Старые кнопки завершённого диалога не изменяют данные и не влияют
    на новый сценарий.
  - >-
    В списке команд Telegram для пользователя публиковать /menu
    с русским описанием «Открыть меню». Сохранить запуск через /start
    и поддержку прежних slash-команд при ручном вводе. В справке,
    пользовательских подсказках и tg-bot/README.md описать навигацию
    по кнопкам и указать, что /menu закрывает незавершённый диалог.

acceptance_criteria:
  - >-
    Новый и существующий пользователь открывают главное меню через /start.
    Пользователь с закрытой клавиатурой может восстановить меню через /menu.
    В опубликованном списке команд Telegram виден /menu с русским описанием.
  - >-
    Каждый пункт главного меню запускает нужный сценарий. В подменю отчётов
    доступны четыре действующих периода и возврат. После показа отчёта
    снова доступно главное меню.
  - >-
    После успешного создания дохода или расхода видны подтверждение и меню,
    автоматического сообщения с балансом нет. Кнопка «Баланс» показывает
    актуальный баланс. После результата поиска, завершения удаления
    или отказа от удаления доступно главное меню.
  - >-
    Во время ввода бот принимает ожидаемые данные. При неверной сумме
    или другом исправимом вводе бот показывает ошибку и продолжает текущий
    шаг. Комментарий «Баланс» сохраняется как текст.
  - >-
    Команда /menu во время заполнения черновика или ожидания подтверждения
    удаления возвращает меню без сохранения или удаления транзакции.
    Нажатие старой кнопки подтверждения после выхода не выполняет действие.
    Следующий сценарий начинается с чистым временным состоянием.

constraints:
  - "Переиспользовать существующие сценарии, правила доступа и проверки. Изменения относятся к навигации в личном чате Telegram."
  - "Проверить список команд в настройках тестового бота. В репозитории подтверждена регистрация обработчиков, а источник опубликованного списка команд не подтверждён."

assumptions:
  - "Выбран автоматический возврат к меню после завершения действия. /menu служит для ручного восстановления меню и выхода из незавершённого диалога."
  - "Требование о переходе к балансу после сохранения в спецификации билдера заменяется переходом в главное меню."
