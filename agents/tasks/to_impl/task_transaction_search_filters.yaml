version: "1.0"
project: "JavaSash/wimmly"
title: "Поиск транзакций по периоду и категории"
task_objective: "Пользователь может искать свои транзакции за произвольный период, по категории или с обоими фильтрами."
complexity: "S"
status: "READY"

current_implementation: >-
  В release/0.2.0 бот запрашивает тип и категорию, а budget возвращает
  до десяти совпадений по возрастанию номера транзакции. Период поиска
  и пропуск категории не поддерживаются. Бот уже подбирает категории
  по типу, разбирает календарные даты и отображает даты транзакций в UTC.
  В том же API есть отдельный поиск по номеру перед удалением.

functional_requirements:
  - >-
    В существующем сценарии поиска показать два независимых фильтра
    «Период» и «Категория» и кнопку «Найти». Показать текущие значения
    или «За всё время» и «Все категории». До запуска поиска пользователь
    может заполнить, изменить или сбросить каждый фильтр отдельно.
  - >-
    Для произвольного периода запросить начальную и конечную даты
    в формате ДД.ММ.ГГГГ. Включить обе календарные даты целиком по UTC.
    Одинаковые даты задают один день. При неверной дате или конце раньше
    начала показать причину по-русски и повторно запросить ошибочную дату,
    сохранив второй фильтр.
  - >-
    Для фильтра категории использовать существующий выбор типа и категории
    этого типа. Показывать русские названия, передавать существующие
    английские коды. Сброс категории снимает ограничение по типу.
  - >-
    По кнопке «Найти» применить заполненные фильтры совместно к транзакциям
    текущего пользователя, затем ограничить выдачу десятью записями
    с действующим порядком по возрастанию номера. При пустом результате
    показать «Транзакций не найдено». Новый поиск начинается с пустых
    фильтров.
  - >-
    Обновить /help и описание поиска в tg-bot/README.md. Указать,
    что фильтры можно сочетать, обе даты включаются в период, а выдача
    содержит до десяти записей.

acceptance_criteria:
  - >-
    Работают четыре сочетания: без фильтров, только период, только
    категория, оба фильтра. Сброс одного фильтра сохраняет второй.
    Поиск только по категории возвращает ту же выдачу, что текущий
    поиск по типу и категории для тех же данных.
  - >-
    Период 10.11.2026–12.11.2026 включает записи от 10.11.2026 00:00 UTC
    до конца 12.11.2026 и исключает записи с 13.11.2026 00:00 UTC.
    При одинаковых датах выдача ограничена одним днём. Дата 31.02.2026
    и обратный диапазон вызывают ошибку с возможностью исправления.
  - >-
    При совместном поиске исключаются записи вне периода, записи
    другого типа с тем же кодом категории и записи другого пользователя.
    При более чем десяти совпадениях лимит применяется после фильтрации.
  - >-
    Запросы к budget без границ периода и поиск по номеру перед удалением
    продолжают работать. Фильтры поиска не влияют на поиск по номеру.

constraints:
  - "Переиспользовать действующий поиск, справочник категорий и правила разбора дат. Расширение запроса периода обратно совместимо."

assumptions:
  - "«В 2 фильтра» означает два необязательных пункта. Выбор типа входит в фильтр категории."
  - "Сохраняется фактический порядок по номеру. Упоминание «10 последних» в текущей справке приводится в соответствие с выдачей."
  - "Размер S выбран по актуальной политике. Это ограниченное расширение существующего поиска с переиспользованием выбора категорий, разбора дат и выдачи."
