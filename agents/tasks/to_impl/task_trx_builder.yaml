version: "1.0"
project: "JavaSash/wimmly"
title: "Билдер необязательных полей при создании транзакции"
task_objective: "После ввода суммы пользователь может сразу сохранить доход или расход либо добавить дату и комментарий в любом порядке."
complexity: "M"
status: "READY"

current_implementation: >-
  В Telegram-боте пользователь выбирает создание дохода или расхода, затем
  категорию и сумму. После корректной суммы EnterAmountStep открывает ASK_DATE,
  затем диалог переходит в ASK_COMMENT. Ответ «Нет» на вопрос о дате записывает
  текущий момент в черновик. После пропуска комментария или его успешного ввода
  CREATE_TRANSACTION создаёт транзакцию и переводит диалог к показу баланса.
  Черновик уже поддерживает дату и комментарий. Сервис budget при отсутствии
  переданной даты использует текущий момент.

functional_requirements:
  - >-
    После корректного ввода суммы для дохода или расхода показать превью
    черновика и один ряд кнопок в указанном порядке: «ввести дату»,
    «ввести комментарий», «готово». Убрать из этого маршрута вопросы о том,
    хочет ли пользователь вводить дату и комментарий.
  - >-
    «ввести дату» и «ввести комментарий» открывают ввод только выбранного
    поля. Корректный ввод сохраняет значение в черновике и возвращает
    пользователя к обновлённому превью. Поля можно заполнять в любом порядке.
  - >-
    В превью показывать тип, категорию, сумму и каждое введённое необязательное
    поле. При каждом показе билдера все три кнопки видимы и активны,
    их названия и порядок сохраняются. Повторный успешный ввод заменяет
    значение выбранного поля и сохраняет остальные данные черновика.
  - >-
    При ошибке валидации показать штатное сообщение и повторно запросить
    выбранное поле. Сохранить последнее корректное значение и остальные
    данные черновика.
  - >-
    «готово» завершает создание транзакции по существующему сценарию
    с подтверждением и показом баланса. Сохраняются актуальные значения
    черновика. Если дату не ввели, применяется текущая дата на момент
    создания транзакции. Если комментарий не ввели, транзакция создаётся
    без комментария.

acceptance_criteria:
  - >-
    Для дохода и расхода после корректной суммы видно превью и один ряд
    из трёх кнопок. Нажатие «готово» сразу создаёт транзакцию с текущей
    датой и без комментария.
  - >-
    Если ввести только дату или только комментарий, билдер вновь показывает
    все три активные кнопки с исходными названиями. Превью и сохранённая
    транзакция содержат введённое значение, а для второго поля применяются
    правила пропуска.
  - >-
    Если заполнить оба поля в любом порядке и затем повторно ввести любое
    из них, превью и сохранённая транзакция содержат последние корректные
    значения обоих полей. При каждом возврате в билдер виден тот же ряд кнопок.
  - >-
    Некорректная дата и комментарий длиннее 50 символов оставляют пользователя
    на вводе соответствующего поля с сообщением об ошибке. После исправления
    открывается обновлённое превью с сохранёнными остальными данными.
  - >-
    Открытие билдера и ввод необязательных полей работают с черновиком.
    После успешного создания повторное нажатие «готово» на том же превью
    не создаёт вторую транзакцию.

constraints:
  - "Использовать существующие правила ввода даты и ограничения длины комментария."
  - "Область изменения ограничена созданием доходов и расходов в Telegram-боте. Достаточно текущего формата черновика и контракта сервиса budget."

assumptions:
  - "В превью показываются только явно введённые необязательные значения. Дата по умолчанию применяется при создании транзакции."

risks:
  - >-
    После возврата к билдеру в чате могут остаться прошлые сообщения
    с кнопками. Действие со старого превью не должно завершать создание
    другого черновика.
