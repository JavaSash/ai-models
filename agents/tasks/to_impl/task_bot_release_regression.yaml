version: "1.0"
project: "JavaSash/wimmly"
title: "Предрелизный регресс через реального Telegram-бота"
task_objective: "Перед релизом автоматически проходить все действующие пользовательские сценарии через отдельного тестового Telegram-бота, подключённого к локальным PostgreSQL и сервисам бэкенда."
complexity: "L"
status: "READY"

current_implementation: >-
  В release/0.2.0 бот получает обновления Telegram через long polling.
  Есть модульные тесты JUnit 5 и Mockito, репозиторные тесты с PostgreSQL
  в Testcontainers и ручной QA-чеклист в tg-bot/README.md. Автоматического
  запуска всех пользовательских сценариев через Telegram в репозитории
  не обнаружено. Владелец уже использует отдельного тестового бота
  с профилем test, локальными PostgreSQL и бэкендом.

functional_requirements:
  - >-
    В каждом сценарии автоматизированный клиент с авторизованной сессией
    выделенного тестового пользователя отправляет команды и ответы,
    нажимает кнопки в полученных сообщениях и получает ответы через
    Telegram. Локальный адаптер с профилем test принимает реальные
    обновления Telegram и работает с локальным budget и PostgreSQL.
    Проверки сверяют видимые сообщения и кнопки, а для операций записи
    также проверяют состояние данных в локальном стеке.
  - >-
    Покрыть первый и повторный /start, регистрацию и восстановление
    пользователя при отсутствии записи в budget, /help, /info
    и /commands. Включить доступные при ручном вводе /access, /contact,
    /photo и /photo_button. Для сценария контакта использовать только
    данные специально выделенной тестовой учётной записи.
  - >-
    Покрыть /add_income и /add_expense с выбором категории, обычной
    суммой и арифметическим выражением, ручным вводом и пропуском даты
    и комментария. Проверить ошибки суммы, включая деление на ноль
    и выход за диапазон, неверную дату и длинный комментарий.
    После исправления проверять сохранение ровно одной транзакции
    с ожидаемыми полями, подтверждение и показ баланса.
  - >-
    Покрыть /search_transactions с выбором типа и категории, лимитом,
    действующим порядком по номеру, пустой выдачей и изоляцией данных
    пользователей. Для /delete_transaction проверить ошибки номера,
    отсутствие записи, недоступность чужой записи, отказ и подтверждение.
    Сверить наличие записи после отказа и её исчезновение из поиска
    и расчётов после подтверждения.
  - >-
    Проверить /balance, /report_today, /report_week, /report_month
    и /report_year на пустых и заполненных данных. Подготовить данные
    относительно границ периодов в часовом поясе приложения.
    Сверить вошедшие записи по их вкладу в суммы, итоговый баланс
    и доли категорий.
  - >-
    Добавить одну документированную команду предрелизного прогона.
    Перед прогоном проверять доступность тестового чата, тестового
    бота и локальных сервисов. Ожидать новые ответы нужного бота
    в нужном чате с ограничением по времени. При недоступном
    окружении или провале обязательного сценария завершать прогон
    с ненулевым кодом и указывать, какой сценарий и шаг не пройдены.
    Описать подготовку сессии, запуск стека и матрицу сценариев
    в tg-bot/README.md рядом с разделом QA.

acceptance_criteria:
  - >-
    После первоначальной настройки сессии весь набор проходит одной
    командой без ручных действий между сценариями. В каждом сценарии
    команды, ответы и нажатия фактически проходят через Telegram.
    В отчёте каждому сценарию из матрицы соответствует результат.
  - >-
    Автотест извлекает кнопку из фактически полученного сообщения,
    отправляет нажатие и проверяет следующий ответ или наблюдаемый
    результат операции. Если подтверждение нажатия от Telegram
    запаздывает, отправка кнопки не повторяется вслепую.
  - >-
    Два последовательных запуска на том же локальном стеке дают одинаковые
    результаты при работоспособном окружении. Тесты работают с выделенными
    пользователями, изолируют состояние диалогов и очищают только свои
    тестовые записи, в том числе после ошибки.
  - >-
    При разрыве связи с Telegram, недействительной сессии или неработающем
    локальном сервисе прогон даёт ненулевой код и сообщает о проблеме
    окружения. При несовпадении сообщения, клавиатуры или данных
    отчёт называет сценарий, ожидаемый и фактический результат.

constraints:
  - "Использовать профиль test и заранее заданный тестовый бот. Прогон обращается к локальным PostgreSQL и бэкенду. На время прогона обновления бота принимает один локальный экземпляр."
  - "Токен, клиентскую сессию и персональные данные тестовых аккаунтов хранить вне репозитория и исключать из отчётов."
  - "Существующие модульные и репозиторные тесты сохранить. Они не заменяют предрелизный прогон через Telegram."

assumptions:
  - "Границы покрытия заданы командами и диалогами release/0.2.0. Меню, билдер и расширенные фильтры из отдельных спецификаций ещё отсутствуют в этой ветке."
  - "Первичная авторизация тестового пользователя допустима один раз до прогона. Готовность отдельной клиентской сессии ещё предстоит подтвердить."
  - "Размер L обусловлен новым автоматизированным клиентом Telegram и объёмом сквозных проверок с реальным транспортом и локальным стеком."
