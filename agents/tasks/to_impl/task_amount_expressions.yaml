version: "1.0"
project: "JavaSash/wimmly"
title: "Арифметические выражения при вводе суммы транзакции"
task_objective: "Пользователь вводит число или арифметическое выражение при создании дохода или расхода. Бот вычисляет и сохраняет итоговую сумму."
complexity: "M"
status: "READY"

current_implementation: >-
  В release/0.2.0 коммит f358ed7 добавил AmountExpressionParser.
  EnterAmountChooser передаёт пользовательский текст в parseAmount
  и записывает результат в черновик. Парсер поддерживает операции,
  приоритеты, пробелы и десятичные числа. MoneyParser округляет итог
  до двух знаков по HALF_UP и проверяет диапазон. Русские примеры есть
  в подсказке перед вводом и в /help, в /info описания формата пока нет.
  При делении с бесконечной десятичной дробью парсер приближает результат
  до 34 значащих цифр, что может изменить округление на границе полкопейки.

functional_requirements:
  - >-
    При создании дохода и расхода принимать число или выражение из чисел,
    круглых скобок и операторов сложения +, вычитания -, умножения *,
    деления \, : и /. Дробная часть отделяется точкой или запятой.
    Поддерживаются знаки + и - перед числом или скобками.
  - >-
    Пробелы в начале и конце ввода и между числами, операторами и скобками
    допустимы. Пробел внутри числа считается ошибкой формата. Степени,
    корни, проценты, буквы, символы валют и прочие символы вне формата
    считаются ошибкой. Пустой ввод и незавершённые выражения также
    считаются ошибкой формата.
  - >-
    Скобки задают порядок вычисления. Умножение и деление выполняются
    раньше сложения и вычитания. Операции одинакового приоритета
    выполняются слева направо.
  - >-
    Вычислять сумму на стороне бота. Округлять конечный результат
    до копеек по HALF_UP. Точность промежуточного деления должна
    сохранять корректное итоговое округление. В черновик и создаваемую
    транзакцию записывать сумму больше нуля и не выше 99999999999999999.99
    после округления. После успешного ввода продолжать штатный сценарий.
  - >-
    При неверном формате показать русское сообщение с допустимым
    примером. Для деления на ноль, суммы вне допустимого диапазона
    и превышения лимитов выражения показать причину ошибки. После
    ошибки повторно запросить сумму, сохранив остальные данные черновика.
  - >-
    Перед вводом суммы, в справке /help и в информации о боте /info
    объяснить на русском, что можно вводить число или выражение.
    Указать допустимые операции, скобки и десятичные разделители,
    привести примеры обычной суммы и выражения.

acceptance_criteria:
  - >-
    В сценариях дохода и расхода ввод 1+2*5\4 даёт сумму 3,50,
    а (1 + 2) * 5 : 4 даёт 3,75. В черновике и сохранённой
    транзакции содержится вычисленная сумма.
  - >-
    Обычный ввод 1500 даёт 1500,00. Ввод 100,50 + 200.25 с пробелами
    вокруг операторов даёт 300,75. Ввод 20 : 2 * 5 даёт 50,00.
  - >-
    Выражение 1 : 8 даёт 0,13. Выражение 1 : 3 * 0,045 даёт 0,02,
    поскольку точный результат равен 0,015.
  - >-
    Ввод 100 руб, 2^3, 100 +, (2 + 3, 12 34 и 2(3+4) вызывает
    ошибку формата. Ввод 1 : (2 - 2) вызывает ошибку деления на ноль.
    Ввод 5 - 10, 0,004 или 99999999999999999.99 + 0.005 вызывает
    ошибку диапазона после округления. Бот остаётся на вводе суммы,
    повторный корректный ввод работает с текущей категорией и типом.
  - >-
    Выражение сверх действующих ограничений отклоняется с сообщением
    о сложности. Подсказка ввода, /help и /info приводят примеры,
    которые бот принимает в обоих сценариях создания.

constraints:
  - "Сохранить существующие ограничения: 256 символов входа, 10 уровней вложенности скобок и 32 цифры на число."
  - "Использовать существующий денежный формат NUMERIC(19,2) и сохранить контракт сервиса budget."

assumptions:
  - "Сохранена поддержка / как уже работающего знака деления, наряду с явно запрошенными \\ и :."
