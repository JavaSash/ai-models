title: "🤖 Собеседование с ИИ-аналитиком"
content: |-
  Начал формировать свой виртуальный отдел разработки с аналитика.
  
  До этого процесс выглядел так: описываю хотелку в чате с ИИ, обсуждаем детали, получаю ТЗ и передаю его агенту, который пишет код.
  
  Проблема в том, что чат не всегда знает нюансы текущей реализации. А агенту потом приходится сопоставлять ТЗ с реальным кодом.
  
  Поэтому решил делегировать подготовку ТЗ отдельному агенту, у которого есть доступ к проекту.
  
  Что от него хочу:
  - изучить существующую реализацию
  - найти переиспользуемый функционал
  - оценить сложность задачи (S/M/L/XL)
  - сформировать требования и критерии приёмки
  - не дёргать меня по мелочам
  
  На выходе получаю YAML-файл, который в будущем будет передаваться следующему агенту.
  
  На первых экспериментах аналитик почти все задачи оценивал как M. Пришлось дорабатывать критерии оценки сложности.
  
  А одну задачу я случайно скормил ему уже после её реализации. Вместо ТЗ на повторную разработку получил анализ существующего функционала и список недоработок.
  
  Неплохой побочный результат эксперимента.
  
  Пока аналитик прошёл испытательный срок. Буду допиливать его инструкции по мере использования.
review_notes:
  - "Подтвердить детали первых экспериментов перед публикацией."
