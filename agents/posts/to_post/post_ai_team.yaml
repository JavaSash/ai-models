title: "🤖 Собираю себе отдел разработки"
content: |-
  Продолжаю исследовать возможности ИИ. На этот раз решил немного отойти от привычного формата работы с ИИ-ассистентом и поэкспериментировать с многоагентными системами.
  
  Хочу попробовать автоматизировать не только написание кода, но и другие этапы SDLC (Software Development Life Cycle).
  
  В моём воображаемом отделе разработки будут:
  
  📝 Аналитик — превращает мои хотелки в ТЗ
  🏗 Архитектор — продумывает реализацию сложных задач
  👨‍💻 Разработчик — пишет код
  🔍 Ревьюер — ищет косяки разработчика
  ⚖️ Арбитр — разрешает спорные моменты
  🧪 Тестировщик — проверяет реализацию
  
  И я — человек, который всё это затеял и пока ещё нужен.
  
  Под это дело завёл отдельный репозиторий ai-models. Там буду хранить инструкции для агентов, шаблоны их выходных артефактов и в будущем — сценарии взаимодействия между ними.
  
  Хочу уложиться в обычную подписку ChatGPT Plus, без дополнительных расходов на API.
  
  Пока никакой автоматической оркестрации. Сначала нужно научить каждого сотрудника нормально выполнять свою работу, а потом уже устраивать корпоратив.
