title: "🤖 Делегирую работу над этим каналом"
content: |-
  Раз уж собираю себе виртуальный отдел разработки, решил завести ещё и SMM-щика.
  
  Раньше для подготовки постов я обсуждал с ИИ свои мысли, получал черновик и переписывал его под себя. Каждый раз приходилось объяснять контекст, формат канала и особенности повествования.
  
  Теперь попробую формализовать и этот процесс.
  
  Для SMM-агента подготовил:
  - описание роли и обязанностей
  - рубрикацию канала
  - требования к стилю и объёму публикаций
  - шаблон выходного артефакта
  
  Самое интересное — собрал 18 своих старых публикаций и разложил их по рубрикам. Агент будет использовать их как примеры моего авторского стиля.
  
  Это называется few-shot prompting. Модель не дообучается на моих текстах, а получает примеры вместе с инструкциями и контекстом задачи.
  
  Заодно расширяю рубрикацию канала:
  
  🚀 Дневник разработки
  💰 Ведение бюджета и инвестиции
  👨‍💻 Технические заметки
  🤖 Эксперименты с ИИ
  
  Публикации по-прежнему буду вычитывать и редактировать сам. Не хочется превращать канал в очередную фабрику нейросетевого контента.
  
  Кстати, черновик этого поста — результат работы того самого SMM-агента.
  
  ИИ пишет про создание ИИ, который пишет про ИИ.
  
  Где-то улыбается Пелевин.
